<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiomaiBot - OpenRouter AI</title>
  <style>
    body { font-family: Arial; background: #fff7e6; }
    #chatbox { 
      width: 350px; height: 400px; border: 3px solid #d32f2f; 
      border-radius: 10px; background: white; position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column;
    }
    #header { background: #d32f2f; color: white; padding: 10px; font-weight: bold; border-radius: 7px 7px 0 0; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; }
    .bot { color: #d32f2f; margin: 5px 0; }
    .user { color: #1976d2; margin: 5px 0; text-align: right; }
    #input-area { display: flex; padding: 10px; border-top: 1px solid #ccc; }
    #input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 5px; }
    #send { background: #d32f2f; color: white; border: none; padding: 5px 15px; border-radius: 5px; margin-left: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div id="chatbox">
  <div id="header">🤖 SiomaiBot - OpenRouter AI</div>
  <div id="messages">
    <div class="bot"><b>SiomaiBot:</b> Hello boss! Ako si SiomaiBot. Ano order mo? 🥟</div>
  </div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Message SiomaiBot...">
    <button id="send">Send</button>
  </div>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function sendMessage() {
  const userMessage = input.value.trim();
  if (!userMessage) return;

  messagesDiv.innerHTML += `<div class="user"><b>Ikaw:</b> ${userMessage}</div>`;
  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  messagesDiv.innerHTML += `<div class="bot"><b>SiomaiBot:</b> Nag-iisip...</div>`;
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const response = await fetch('https://openrouter-proxy-tumy.onrender.com/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        "model": "openai/gpt-4o-mini",
        "messages": [
          { "role": "system", "content": "Ikaw si SiomaiBot. Taga-benta ka ng One Big Siomai. Magalang ka at matulungin. Mag-reply ka ng maikli at Tagalog." },
          { "role": "user", "content": userMessage }
        ]
      })
    });

    const data = await response.json();
    const botReply = data.choices[0].message.content;

    // burahin yung "Nag-iisip..."
    messagesDiv.lastChild.remove();
    messagesDiv.innerHTML += `<div class="bot"><b>SiomaiBot:</b> ${botReply}</div>`;
    
  } catch (error) {
    messagesDiv.lastChild.remove();
    messagesDiv.innerHTML += `<div class="bot"><b>SiomaiBot:</b> Ay boss error: ${error.message} 😅</div>`;
  }
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
