<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#FFF8E1;padding:15px;min-height:100vh;padding-right:280px}
.container{max-width:2000px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,0.12);border-top:6px solid #D32F2F}
h2{color:#D32F2F;text-align:center;margin-bottom:8px;font-size:24px}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}

.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:768px){.prod-grid{grid-template-columns:repeat(4,1fr)} }
.prod-card{background:#FFFDF7;border:2px solid #FFCC80;border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative}
.prod-card.out{opacity:0.5;pointer-events:none}
.prod-img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:#f5f5f5}
.prod-name{font-weight:800;font-size:12px;color:#D32F2F;margin-bottom:4px;height:28px}
.prod-price{font-size:14px;font-weight:900;color:#2E7D32}
.price-tags{font-size:8px;color:#666}
.stock-label{font-size:10px;font-weight:800;color:#2E7D32;margin-top:4px}
.stock-label.low{color:#FF6F00}
.stock-label.out{color:white;background:#D32F2F;padding:2px 6px;border-radius:4px;display:inline-block}
.cart-bar{position:fixed;top:15px;right:0;width:280px;max-height:95vh;background:white;border:3px solid #D32F2F;border-left:0;border-radius:15px 0 0 15px;padding:12px}
.cart-list{max-height:300px;overflow-y:auto}
.cart-row{display:grid;grid-template-columns:18px 1fr 70px;gap:4px;align-items:center;font-size:10px;padding:6px 0;border-bottom:1px dashed #eee}
.del-btn{background:#C62828;color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:14px;line-height:1;cursor:pointer}
.qty-box{display:flex;gap:3px;align-items:center}
.qty-btn{width:20px;height:20px;border:none;background:#D32F2F;color:white;border-radius:4px;font-weight:800;cursor:pointer;font-size:11px}
.qty-input{width:40px;height:20px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:10px}
.cart-sum{font-size:18px;font-weight:900;color:#D32F2F;text-align:right;margin:8px 0}
.checkout-btn{width:100%;padding:10px;background:#2E7D32;color:white;border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer}
.checkout-btn:disabled{background:#ccc}
.loading{text-align:center;padding:40px;color:#D32F2F;font-weight:700}
.cash-box{background:#E8F5E9;padding:12px;border-radius:8px;margin-bottom:10px}
.cash-box input{width:100%;padding:10px;font-size:16px;border:2px solid #2E7D32;border-radius:6px;font-weight:700}
.change{font-size:18px;font-weight:900;color:#D32F2F;text-align:center;margin-top:5px}
@media (max-width:768px) {body{padding-right:15px;padding-bottom:280px}.cart-bar{top:auto;bottom:0;right:0;left:0;width:100%}}
</style>
</head>
<body>
<div class="container">
<button class="back-btn" onclick="window.location='index.html'">← Back to Menu</button>

<div class="type-grid">

</div>
<!-- PAYMENT MODAL -->
<div id="payModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:9999">
<div style="background:white;padding:25px;border-radius:12px;width:90%;max-width:400px">

<h2 style="margin-top:0;color:#D32F2F">Payment</h2>
<p id="reviewTotal" style="font-size:20px;font-weight:bold;margin:15px 0">Total: ₱0.00</p>
<label style="font-size:13px;font-weight:700">Payment Method:</label>

<input type="file" id="proofFile" accept="image/*" style="width:100%;padding:8px;border:2px dashed #FFCC80;border-radius:8px;background:#FFFDF7">

<!-- RECEIPT MODAL -->
<div id="receiptModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:9999">
<div style="background:white;padding:20px;border-radius:12px;width:90%;max-width:320px">
<div id="receipt" style="font-family:'Courier New',monospace;font-size:11px;line-height:1.3">
<div style="text-align:center"><b style="font-size:14px">ONE SIOMAI FACTORY</b><br><span style="font-size:10px">Quezon City, Philippines</span></div>
<hr style="border:none;border-top:1px dashed #000;margin:4px 0">
<div id="rHeader" style="font-size:10px"></div>
<hr style="border:none;border-top:1px dashed #000;margin:4px 0">
<table style="width:100%;font-size:10px">
<thead><tr><td colspan="3">--------------------------------</td></tr>
<tr><td><b>ITEM</b></td><td align="center"><b>QTY</b></td><td align="right"><b>AMT</b></td></tr>
<tr><td colspan="3">--------------------------------</td></tr></thead>
<tbody id="rItems"></tbody>
<tr><td colspan="3">--------------------------------</td></tr>
</table>
<div style="text-align:right;font-weight:900;font-size:13px" id="rTotal"></div>
<div id="rCash" style="font-size:10px"></div>

</div>
<button onclick="window.printReceipt()" style="width:100%;padding:12px;background:#D32F2F;color:white;border:none;border-radius:8px;font-weight:700;margin-top:10px">🖨️ Print Receipt</button>

</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, addDoc, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",projectId: "dhan-siomai-pos-fe1e5"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// DITO MO ILAGAY API KEY MO BOSS
const GEMINI_API_KEY = prompt("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:")

let products = [];
let cart = [];
let curCat = 'all';
let currentTotal = 0;
let currentSaleType = 'Retail';
let base64Proof = '';
let lastSaleData = {};
let cashTendered = 0;
let cashChange = 0;

// SIOMAIBOT FUNCTIONS
function appendChat(msg){
  const chatMessages = document.getElementById('chatMessages');
  if(chatMessages){
    chatMessages.innerHTML += `<div style="margin:5px 0">${msg}</div>`;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  return chatMessages.lastChild;
}

function addToCartFromChat(itemName, qty){
  const product = products.find(p => p.name.toLowerCase().includes(itemName.toLowerCase()));
  if(product){
    for(let i=0; i<qty; i++) addToCart(product.id);
    appendChat(`<b>SiomaiBot:</b> Na-add ko na ${qty}x ${product.name} boss!`);
  } else {
    appendChat(`<b>SiomaiBot:</b> Wala ako nakitang "${itemName}" boss`);
  }
}

async function sendToGemini(userText){
  const loadingMsg = appendChat(`<i>Naiisip ni SiomaiBot...</i>`);
  try{
    // PINAIKLI PARA DI SUMABOG SA TOKENS
    const shortMenu = products.slice(0, 10).map(p => `${p.name} P${p.price}`).join(", ");

    const prompt = `Ikaw si SiomaiBot ng One Siomai Factory. Saleslady ka. Tagalog lang. Maikli.
MENU: ${shortMenu}
RULES: Pag "pabili 2 pork" = addToCartFromChat("pork", 2). Pag "checkout" = aiCheckout().`;
 const res = await fetch(`https://openrouter.ai/api/v1/chat/completions`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${GEMINI_API_KEY}`,
    'HTTP-Referer': window.location.href,
        'X-Title': 'SiomaiBot POS',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'deepseek/deepseek-chat-v3-0324',
        messages: [{ role: 'user', content: prompt + "\n\nUser: " + userText }],
      }),
    });
    const data = await res.json();
    loadingMsg.remove();
    if(data.choices && data.choices[0] && data.choices[0].message){
      const reply = data.choices[0].message.content;
      appendChat(`<b>SiomaiBot:</b> ${reply}`);
      // Auto commands
      const cartMatch = reply.match(/addToCartFromChat\([^)]+\)/);
      if(cartMatch) eval(cartMatch[0]);
      if(reply.includes("aiCheckout()")) aiCheckout();
    } else {
      appendChat(`<b>SiomaiBot:</b> Ay boss error: ${data.error?.message || "Walang reply"}`);
    }
  }catch(e){
    loadingMsg.remove();
    appendChat(`<b>SiomaiBot:</b> Ay boss error: ${e.message}`);
  }
}
function aiCheckout(){
  if(cart.length === 0){
    appendChat(`<b>SiomaiBot:</b> Wala pa sa cart boss`);
    return;
  }
  openPayModal();
  appendChat(`<b>SiomaiBot:</b> Sige boss, payment na tayo!`);
}
window.sendMessage = function(){
  const input = document.getElementById('chatInput');
  const text = input.value;
  if(!text) return;
  appendChat(`<b>Ikaw:</b> ${text}`);
  input.value = '';
  sendToGemini(text);
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('chatInput').addEventListener('keypress', function(e){
    if(e.key === 'Enter') window.sendMessage();
  });
  appendChat(`<b>SiomaiBot:</b> Hello boss! Ako si SiomaiBot. Ano order mo?`);
});
function getTotal(){return currentTotal}
async function compressProof(file) { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (event) => { const img = new Image(); img.src = event.target.result; img.onload = () => { let quality = 0.6; let maxWidth = 800; let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d'); function tryCompress() { let width = img.width; let height = img.height; if(width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; } canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height); let base64 = canvas.toDataURL('image/jpeg', quality); let sizeKB = Math.round(base64.length / 1024); if(sizeKB > 500 && quality > 0.2) { quality -= 0.1; tryCompress(); } else if(sizeKB > 500 && maxWidth > 400) { maxWidth -= 100; quality = 0.6; tryCompress(); } else { resolve({base64:base64, size:sizeKB}); } } tryCompress(); } } }); }
function getKgPerPack(cat){ if(cat==='65s')return 1; if(cat==='30s')return 0.5; if(cat==='big')return 0.7; return 1 }
function getTotalCartKg(){return cart.reduce((sum,item)=>sum+Number(item.qty)*getKgPerPack(item.category),0)}
function getPrice(p){ const totalKg=getTotalCartKg(); if(currentSaleType === 'Wilbert' && Number(p.wilbertPrice)>0) return Number(p.wilbertPrice); if(currentSaleType === 'VIP' && Number(p.vipPrice)>0) return Number(p.vipPrice); if(Number(p.bulkPrice)>0 && Number(p.bulkMinQty)>0 && totalKg>=Number(p.bulkMinQty)) return Number(p.bulkPrice); return Number(p.price)||0; }
window.setSaleType = (type, btn) => { currentSaleType = type; document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderCart(); }
async function loadProducts(){ const grid=document.getElementById('prodGrid'); grid.innerHTML='<div class="loading">Loading products...</div>'; let q=collection(db,"products"); if(curCat!='all')q=query(collection(db,"products"),where("category","==",curCat)); const snap=await getDocs(q); products=[]; snap.forEach(d=>products.push({id:d.id,...d.data()})); renderProducts(); }
function renderProducts(){ const grid=document.getElementById('prodGrid'); if(products.length===0){ grid.innerHTML='<p style="grid-column:span 2;text-align:center;color:#999;padding:40px">No products yet</p>'; return; } let html=''; products.forEach(prod=>{ const stock = Number(prod.stock) || 0; let stockClass = ''; let stockText = `Stock: ${stock}`; let cardClass = ''; if(stock <= 0){ stockClass = 'out'; stockText = 'OUT OF STOCK'; cardClass = 'out'; } else if(stock <= 5){ stockClass = 'low'; } html+=`<div class="prod-card ${cardClass}" onclick="window.addToCart('${prod.id}')">`+ (prod.image?`<img src="${prod.image}" class="prod-img">`:'<div class="prod-img">No Image</div>')+ `<div class="prod-name">${prod.name}</div>`+ `<div class="prod-price">₱${prod.price}</div>`+ `<div class="price-tags">Bulk:₱${prod.bulkPrice||'-'} Wilbert:₱${prod.wilbertPrice||'-'} VIP:₱${prod.vipPrice||'-'}</div>`+ `<div class="stock-label ${stockClass}">${stockText}</div>`+ `</div>`; }); grid.innerHTML=html; }
window.filterCat=(cat,btn)=>{ curCat=cat; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); loadProducts(); }
window.addToCart=(prodId)=>{ const prod=products.find(p=>p.id===prodId); if(!prod || (Number(prod.stock)||0) <= 0){ alert('Out of stock na boss!'); return; } const existing=cart.find(item=>item.id===prodId); if(existing){ if(existing.qty >= (Number(prod.stock)||0)){ alert('Wala nang stock boss!'); return; } existing.qty++; }else{ cart.push({...prod,qty:1}); } renderCart(); }
function renderCart(){ let total=0; let html=''; cart.forEach((item,i)=>{ let price=getPrice(item); total+=price*item.qty; html+=`<div class="cart-row">`+ `<button class="del-btn" onclick="window.removeItem(${i})">×</button>`+ `<span>${item.name} @₱${price}</span>`+ `<div class="qty-box"><button class="qty-btn" onclick="window.changeQty(${i},-1)">-</button><input type="number" class="qty-input" value="${item.qty}" onchange="window.setQty(${i},this.value)"><button class="qty-btn" onclick="window.changeQty(${i},1)">+</button></div>`+ `</div>`; }); document.getElementById('cartList').innerHTML=html||'No items yet'; document.getElementById('cartSum').innerText=`Total: ₱${total.toFixed(2)}`; currentTotal=total; document.getElementById('checkoutBtn').disabled=cart.length===0; }
window.removeItem=(i)=>{cart.splice(i,1);renderCart()}
window.changeQty=(i,d)=>{const prod=products.find(p=>p.id===cart[i].id); cart[i].qty+=d; if(cart[i].qty<1)cart[i].qty=1; if(cart[i].qty > (Number(prod.stock)||0))cart[i].qty=Number(prod.stock)||0; renderCart();}
window.setQty=(i,val)=>{ val=parseInt(val)||1; const prod=products.find(p=>p.id===cart[i].id); if(val > (Number(prod.stock)||0))val=Number(prod.stock)||0; cart[i].qty=val; renderCart(); }
window.openPayModal=()=>{ document.getElementById('reviewTotal').textContent=`Total: ₱${currentTotal.toFixed(2)}`; document.getElementById('payModal').style.display='flex'; window.toggleProof(); }
window.closePayModal=()=>{ document.getElementById('payModal').style.display='none'; document.getElementById('proofFile').value=''; document.getElementById('proofPreview').style.display='none'; document.getElementById('proofSize').innerText=''; document.getElementById('cashAmount').value=''; document.getElementById('changeText').innerText='Change: ₱0.00'; base64Proof=''; cashTendered=0; cashChange=0; }
window.toggleProof=()=>{ const method=document.getElementById('payMethod').value; const proofDiv=document.getElementById('proofDiv'); const bankDiv=document.getElementById('bankDiv'); const cashDiv=document.getElementById('cashDiv'); cashDiv.style.display = method==='Cash'? 'block' : 'none'; if(method==='Gcash' || method==='Bank Transfer'){ proofDiv.style.display='block'; bankDiv.style.display= method==='Bank Transfer'? 'block' : 'none'; } else{ proofDiv.style.display='none'; bankDiv.style.display='none'; } }
window.calcChange=()=>{ cashTendered = parseFloat(document.getElementById('cashAmount').value) || 0; cashChange = cashTendered - currentTotal; document.getElementById('changeText').innerText = `Change: ₱${cashChange.toFixed(2)}`; if(cashChange < 0) document.getElementById('changeText').style.color = '#C62828'; else document.getElementById('changeText').style.color = '#2E7D32'; }
document.getElementById('proofFile').addEventListener('change',async function(e){ const file=e.target.files[0]; if(file){ document.getElementById('confirmBtn').innerText='Compressing proof...'; document.getElementById('confirmBtn').disabled=true; const result=await compressProof(file); base64Proof=result.base64; document.getElementById('proofPreview').src=base64Proof; document.getElementById('proofPreview').style.display='block'; document.getElementById('proofSize').innerText=`Size: ${result.size}KB - Compressed`; document.getElementById('confirmBtn').innerText='Confirm Payment'; document.getElementById('confirmBtn').disabled=false;
