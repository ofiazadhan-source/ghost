  if(today > realExpire && !isUnlocked){
    document.addEventListener("DOMContentLoaded", function(){

        </div>
      `;
    });
  } else {
    // show days left sa console lang, di halata
    const diff = Math.ceil((realExpire - today)/(1000*60*60*24));
    console.log("License: "+diff+" days left");
  }
})();
