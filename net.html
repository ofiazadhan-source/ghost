<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Profit Report</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#FFF8E1;padding:15px}
.container{max-width:900px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,0.12);border-top:6px solid #D32F2F}
h2{color:#D32F2F;text-align:center;margin-bottom:15px;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.back-btn{background:#757575;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.card{padding:12px;border-radius:12px;text-align:center}
.card h4{font-size:11px;color:#666;margin-bottom:5px}
.card h2{font-size:20px;margin:0;color:#000}
.net-card{background:linear-gradient(135deg,#2E7D32,#388E3C);color:white}
.net-card h4{color:#C8E6C9}
.net-card h2{color:white}
.exp-card{background:#FFEBEE}
.exp-card h2{color:#C62828}
.date-row{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.date-row input{padding:10px;border:2px solid #FFCC80;border-radius:8px;flex:1;min-width:120px}
.load-btn{padding:10px 20px;background:#D32F2F;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.all-btn{padding:10px 20px;background:#2E7D32;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.sale-card{background:#FFFDF7;border:2px solid #FFCC80;border-radius:12px;padding:12px;margin-bottom:10px}
.sale-head{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:5px}
.sale-date{color:#D32F2F;font-weight:700;font-size:13px}
.badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-rtl{background:#C8E6C9;color:#2E7D32}
.badge-wlb{background:#BBDEFB;color:#1565C0}
.badge-vip{background:#F8BBD0;color:#AD1457}
.badge-cash{background:#E0E0E0;color:#424242}
.badge-gcash{background:#B3E5FC;color:#0277BD}
.badge-bank{background:#FFE0B2;color:#E65100}
.sale-total{font-size:18px;font-weight:900;color:#2E7D32}
.sale-items{font-size:11px;color:#555;line-height:1.5}
.proof-img{max-width:100px;max-height:100px;margin-top:5px;border-radius:6px;border:1px solid #ddd}
.section-title{color:#D32F2F;font-weight:800;margin:15px 0 10px;font-size:16px;border-bottom:2px solid #FFCC80;padding-bottom:5px}
</style>
</head>
<body>
<div class="container">
<h2>💰 Net Profit Report <button class="back-btn" onclick="window.location='index.html'">← Back</button></h2>

<div class="date-row">
<input type="date" id="dateFrom">
<input type="date" id="dateTo">
<button class="load-btn" onclick="window.loadReport()">Load</button>
<button class="all-btn" onclick="window.loadAll()">Load All</button>
</div>

<div class="grid">
<div class="card" style="background:#E8F5E9"><h4>Total Sales</h4><h2 id="totalSales">₱0</h2></div>
<div class="card exp-card"><h4>Daily Expenses</h4><h2 id="dailyExpenses">₱0</h2></div>
<div class="card exp-card"><h4>Monthly Expenses</h4><h2 id="monthlyExpenses">₱0</h2></div>
<div class="card" style="background:#E3F2FD"><h4>Wholesale Sales</h4><h2 id="wholesaleSales" style="color:#1565C0">₱0</h2></div>
<div class="card" style="background:#F3E5F5"><h4>Retail Sales</h4><h2 id="retailSales" style="color:#6A1B9A">₱0</h2></div>
<div class="card net-card"><h4>NET PROFIT</h4><h2 id="netProfit">₱0</h2></div>
<div class="card" style="background:#FCE4EC"><h4>GCash Sales</h4><h2 id="gcashSales" style="color:#C2185B">₱0</h2></div>
<div class="card" style="background:#F5F5F5"><h4>Cash Sales</h4><h2 id="cashSales">₱0</h2></div>
<div class="card" style="background:#FFF3E0"><h4>Bank Sales</h4><h2 id="bankSales" style="color:#E65100">₱0</h2></div>
</div>

<h3 class="section-title">📋 Sales List - Sorted by Time</h3>
<div id="salesList">Loading...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyDk3ZbOXuw3PEfJzdt8AI2ueJq5yksfekE",authDomain: "dhan-siomai-pos-fe1e5.firebaseapp.com",projectId: "dhan-siomai-pos-fe1e5"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const today = new Date();
document.getElementById('dateFrom').valueAsDate = today;
document.getElementById('dateTo').valueAsDate = today;

let currentTotalSales = 0;

async function getExpenses(type, from, to){
  try{
    const q = query(collection(db,"expenses"), 
      where("type","==",type),
      where("timestamp",">=",Timestamp.fromDate(from)),
      where("timestamp","<=",Timestamp.fromDate(to))
    );
    const snap = await getDocs(q);
    let total = 0;
    snap.forEach(doc=>{ total += Number(doc.data().amount) || 0; });
    return total;
  }catch(e){
    console.log("No expenses yet or error:", e);
    return 0;
  }
}

async function processSales(snap, from, to){
  let total=0, wholesale=0, retail=0, gcash=0, cash=0, bank=0;
  let html='';
  
  snap.forEach(doc=>{
    const s = doc.data();
    const saleType = s.saleType || 'Retail';
    const payMethod = s.paymentMethod || 'Cash';
    const bankName = s.bankName || '';
    
    total += Number(s.total) || 0;
    if(saleType === 'Wilbert' || saleType === 'VIP') wholesale += Number(s.total) || 0;
    else retail += Number(s.total) || 0;
    
    if(payMethod === 'Gcash') gcash += Number(s.total) || 0;
    else if(payMethod === 'Bank Transfer') bank += Number(s.total) || 0;
    else cash += Number(s.total) || 0;
    
    const date = s.timestamp.toDate().toLocaleString('en-PH', {timeZone: 'Asia/Manila'});
    const typeBadge = saleType==='Wilbert' ? 'badge-wlb' : saleType==='VIP' ? 'badge-vip' : 'badge-rtl';
    const payBadge = payMethod==='Gcash' ? 'badge-gcash' : payMethod==='Bank Transfer' ? 'badge-bank' : 'badge-cash';
    
    let items = s.items.map(i=>`${i.name} x${i.qty} = ₱${Number(i.total).toFixed(2)}`).join('<br>');
    let proof = s.proofOfPayment ? `<img src="${s.proofOfPayment}" class="proof-img">` : '';
    
    html += `<div class="sale-card">
      <div class="sale-head">
        <span class="sale-date">${date}</span>
        <div>
          <span class="badge ${typeBadge}">${saleType.substring(0,3).toUpperCase()}</span>
          <span class="badge ${payBadge}">${payMethod.toUpperCase()}${bankName? ' - '+bankName : ''}</span>
        </div>
      </div>
      <div class="sale-total">₱${Number(s.total).toFixed(2)}</div>
      <div class="sale-items">${items}</div>
      ${proof}
    </div>`;
  });
  
  currentTotalSales = total;
  
  // KUHA NG EXPENSES
  const dailyExp = await getExpenses('Daily', from, to);
  const monthStart = new Date(from.getFullYear(), from.getMonth(), 1);
  const monthEnd = new Date(from.getFullYear(), from.getMonth()+1, 0, 23,59,59);
  const monthlyExp = await getExpenses('Monthly', monthStart, monthEnd);
  
  const netProfit = total - dailyExp - monthlyExp;
  
  // UPDATE UI
  document.getElementById('totalSales').innerText = '₱'+total.toLocaleString();
  document.getElementById('dailyExpenses').innerText = '₱'+dailyExp.toLocaleString();
  document.getElementById('monthlyExpenses').innerText = '₱'+monthlyExp.toLocaleString();
  document.getElementById('netProfit').innerText = '₱'+netProfit.toLocaleString();
  document.getElementById('wholesaleSales').innerText = '₱'+wholesale.toLocaleString();
  document.getElementById('retailSales').innerText = '₱'+retail.toLocaleString();
  document.getElementById('gcashSales').innerText = '₱'+gcash.toLocaleString();
  document.getElementById('cashSales').innerText = '₱'+cash.toLocaleString();
  document.getElementById('bankSales').innerText = '₱'+bank.toLocaleString();
  document.getElementById('salesList').innerHTML = html || 'No sales found';
}

window.loadReport = async function(){
  document.getElementById('salesList').innerHTML = 'Loading...';
  const fromVal = document.getElementById('dateFrom').value;
  const toVal = document.getElementById('dateTo').value;
  const from = new Date(fromVal + 'T00:00:00');
  const to = new Date(toVal + 'T23:59:59');
  const q = query(collection(db,"sales"), 
    where("timestamp",">=",Timestamp.fromDate(from)),
    where("timestamp","<=",Timestamp.fromDate(to)),
    orderBy("timestamp","desc")
  );
  const snap = await getDocs(q);
  await processSales(snap, from, to); // <-- DITO YUNG FIX MAY AWAIT
}

window.loadAll = async function(){
  document.getElementById('salesList').innerHTML = 'Loading...';
  const from = new Date(2024,0,1);
  const to = new Date();
  const q = query(collection(db,"sales"), orderBy("timestamp","desc"));
  const snap = await getDocs(q);
  await processSales(snap, from, to); // <-- DITO DIN MAY AWAIT
}

// AUTO LOAD ALL
window.loadAll();
</script>
</body>
</html>
