<!DOCTYPE html>
<html>
<head>
  <title>Bessie AI - One Siomai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; margin: 0; }
   .container { max-width: 600px; margin: auto; }
    h2 { text-align: center; font-size: 28px; }
    #chat { background: #16213e; height: 500px; overflow-y: auto; padding: 15px; border-radius: 15px; margin-bottom: 15px; font-size: 18px; }
   .ai { color: #00d4ff; margin: 10px 0; }
   .user { color: #00ff88; margin: 10px 0; text-align: right; }
   .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 15px; font-size: 18px; border-radius: 10px; border: none; }
    button { padding: 15px 25px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; background: #00d4ff; color: black; font-weight: bold; }
    #micBtn { background: #ff006e; }
    #micBtn.listening { background: #00ff88; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🤖 BESSIE AI - ONE SIOMAI</h2>
    <div id="chat"></div>
    <div class="input-area">
      <input id="msg" placeholder="Type mo dito o click Mic...">
      <button id="micBtn" onclick="startListening()">🎤 MIC</button>
      <button onclick="send()">SEND</button>
    </div>
  </div>

  <script>
    // Para magsalita si Bessie
    function speak(text) {
      let chat = document.getElementById("chat");
      chat.innerHTML += `<div class="ai">Bessie: ${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
      
      // Magsasalita na si Bessie
      let speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'fil-PH'; // Tagalog
      speech.rate = 1;
      speechSynthesis.speak(speech);
    }

    // Para magtype
    function send() {
      let input = document.getElementById("msg");
      let user = input.value.toLowerCase();
      if(user === "") return;
      
      document.getElementById("chat").innerHTML += `<div class="user">Ikaw: ${user}</div>`;
      reply(user);
      input.value = "";
    }

    // Para sa MIC
    function startListening() {
      let btn = document.getElementById("micBtn");
      btn.classList.add("listening");
      btn.innerText = "🔴 NAKIKINIG...";
      
      let recognition = new webkitSpeechRecognition() || new SpeechRecognition();
      recognition.lang = 'fil-PH'; // Tagalog
      recognition.onresult = function(event) {
        let speech = event.results[0][0].transcript;
        document.getElementById("msg").value = speech;
        send();
      }
      recognition.onend = function() {
        btn.classList.remove("listening");
        btn.innerText = "🎤 MIC";
      }
      recognition.start();
    }

    // Utak ni Bessie
    function reply(user) {
      if(user.includes("tigil") || user.includes("bye")) speak("Bye boss! Ingat ka");
      else if(user.includes("payment") || user.includes("bayad")) speak("Tanggap natin Cash, Gcash, at Bank Transfer boss");
      else if(user.includes("price") || user.includes("presyo")) speak("May Retail, Wilbert, at VIP pricing tayo");
      else if(user.includes("product") || user.includes("produkto")) speak("May 65s, 30s, Big Siomai, Dumplings, at Siopao tayo");
      else if(user.includes("65s")) speak("Ang 65s Retail ay 12 pesos each");
      else speak("Narinig ko: " + user);
    }

    // Enter to send
    document.getElementById("msg").addEventListener("keypress", function(e){
      if(e.key === "Enter") send();
    });

    speak("Hello boss! Ako si Bessie ng One Siomai. Click mo yung MIC o type ka lang");
  </script>
</body>
</html>
